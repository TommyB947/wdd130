<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="description"
      content="Contact the Dry Oar Rafting team. Find our address and contact infromation on this page. ">
    <meta name="author" content="Thomas Bates">
</head>

<body>
    <header class="grid1">
        <img src="images/logo.png" alt="Company Logo">
        <nav>
            <ul class="parent1">
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="about.html">About Us</a>
                </li>
                <li>
                    <a href="trips.html">Trips</a>
                </li>
                <li>
                    <a href="contact.html">Contact Us</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h1>Dry Oar Rafting LLC</h1>
            <p class="address">123 Place Pl.</p>
            <p class="address">Place, Texas</p>
            <p class="address">+1 999 999 9999</p>
            <p class="address">dryorerafting@whitewater.com</p>
            <section class="grid5">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3106.2790569748067!2d-77.05626689999998!3d38.871856799999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89b7b6df29ed2c27%3A0xaf83d0f8c013532f!2sThe%20Pentagon!5e0!3m2!1sen!2sus!4v1785469061124!5m2!1sen!2sus"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
                <form class="grid6">
                    <div class="form-item">
                        <label for="name">Full Name: </label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-item">
                        <label for="useremail">Email: </label>
                        <input type="email" id="useremail" name="useremail" required>
                    </div>
                    <div class="form-item grid7">
                        <p class="child9">Message Purpose</p>
                        <section>
                            <input type="radio" id="inquiry" name="message">
                            <label for="inquiry">General Inquiry</label>
                        </section>
                        <section>
                            <input type="radio" id="reservation" name="message">
                            <label for="reservation">Reservation Question</label>
                        </section>
                        <section>
                            <input type="radio" id="suggestion" name="message">
                            <label for="suggestion">Website Suggestion</label>
                        </section>
                    </div>
                    <div class="form-item grid8">
                        <label class="child10" for="message">Message</label>
                        <textarea class="child11" id="message" name="message" rows="4"
                          placeholder="Type here"></textarea>
                    </div>
                    <div class="form-item">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        <label for="subscribe">Please Subscribe me to the monthly
                            newsletter!</label>
                    </div>
                    <div class="form-item">
                        <button type="submit">Get In Touch!</button>
                    </div>
                </form>
            </section>
            <section class="grid4">
                <h2 class="child6">We Are Here to Serve You</h2>
                <figure class="child7">
                    <img src="images/employee1.jpg" alt="John Doe">
                    <figcaption>John Doe</figcaption>
                </figure>
                <figure class="child7">
                    <img src="images/employee2.jpg" alt="Robert Dow">
                    <figcaption>Robert Doe</figcaption>
                </figure>
                <figure class="child7">
                    <img src="images/employee3.jpg" alt="Rusty Don">
                    <figcaption>Rusty Don</figcaption>
                </figure>
            </section>
        </section>
    </main>
    <footer class="parent2">
        <p>&copy;2026 - Dry Oar Rafting - Thomas Bates</p>
        <nav class="socialmedia">
            <a href="https://linkedin.com"><img src="images/linkedin.png" alt="LinkedIn"></a>
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="https://instagram.com"><img src="images/instagram.png" alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
